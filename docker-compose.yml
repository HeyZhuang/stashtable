services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      SATDASH_DB: /app/data/satdash.db
      SATDASH_DATA_DIR: /app/data
      LLMOPS_API_URL: http://host.docker.internal:80
      USE_LLMOPS_AUTH: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - satdash-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  satdash-data:
