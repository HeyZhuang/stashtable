server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /satdash/api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /satdash/ws/ {
    proxy_pass http://backend:8000/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
  # 公网最外层保留 /satdash 前缀；静态文件仍由本容器提供。
  location /satdash/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /satdash/index.html;
    # index.html 每次重新验证，防止浏览器缓存旧版引用旧 JS（hash 资源本身带版本号可长缓存）
    location = /satdash/index.html {
      add_header Cache-Control "no-cache, must-revalidate";
    }
    # 带 hash 的静态资源长缓存（嵌套在 alias 内，保持路径解析）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ico)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
    }
  }
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }
  location / { try_files $uri $uri/ /index.html; }
}
